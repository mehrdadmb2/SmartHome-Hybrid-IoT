<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>داشبورد آنلاین</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="stars"></div>
  <div class="aurora"></div>
  <div class="floating-icons">
    <span class="float-icon" style="top:10%;left:5%;"><i class="fas fa-cloud"></i></span>
    <span class="float-icon" style="top:80%;left:90%;"><i class="fas fa-database"></i></span>
  </div>

  <div class="container">
    <header class="glass">
      <h1 class="neon-text" data-lang="title">🌐 مانیتورینگ آنلاین</h1>
      <div class="datetime" id="datetime">--</div>
      <div class="controls">
        <button id="theme-toggle" class="glass-btn">🌓</button>
        <button id="lang-toggle" class="glass-btn">فا / En</button>
      </div>
    </header>

    <div class="node-status-bar glass" id="node-bar">
      <div class="node"><span>🖥️ هاب</span><span class="status-dot" id="hub-status"></span></div>
      <div class="node"><span>🌡️ S3</span><span class="status-dot" id="s3-status"></span></div>
      <div class="node"><span>🚪 درب</span><span class="status-dot" id="door-status"></span></div>
    </div>

    <div class="cards-row">
      <div class="glass card"><i class="fas fa-thermometer-half card-icon"></i><h3>اتاق ۱</h3><p><span id="t1">--</span>°C | <span id="h1">--</span>%</p></div>
      <div class="glass card"><i class="fas fa-thermometer-half card-icon"></i><h3>اتاق ۲</h3><p><span id="t2">--</span>°C | <span id="h2">--</span>%</p></div>
      <div class="glass card"><i class="fas fa-door-open card-icon"></i><h3>درب</h3><p>امروز: <span id="door-total">0</span></p></div>
      <div class="glass card"><i class="fas fa-sd-card card-icon"></i><h3>SD</h3><p>آزاد: <span id="sd-free">--</span>MB</p></div>
    </div>

    <div class="charts-grid">
      <div class="glass chart-card">
        <div class="chart-header">
          <h3>اتاق ۱</h3>
          <select class="range-select" data-board="esp32_1">
            <option value="hourly">ساعتی</option>
            <option value="daily" selected>روزانه</option>
            <option value="weekly">هفتگی</option>
            <option value="monthly">ماهانه</option>
          </select>
          <input type="date" class="date-picker" data-board="esp32_1">
        </div>
        <canvas id="chart1"></canvas>
      </div>
      <div class="glass chart-card">
        <div class="chart-header">
          <h3>اتاق ۲</h3>
          <select class="range-select" data-board="esp32_s3">
            <option value="hourly">ساعتی</option>
            <option value="daily" selected>روزانه</option>
            <option value="weekly">هفتگی</option>
            <option value="monthly">ماهانه</option>
          </select>
          <input type="date" class="date-picker" data-board="esp32_s3">
        </div>
        <canvas id="chart2"></canvas>
      </div>
    </div>

    <footer class="glass" style="text-align:center; margin-top:2rem;">SmartHome-Hybrid-IoT</footer>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.3.2/papaparse.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
