<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>خانه هوشمند - آنلاین</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>🌐 مانیتورینگ خانه</h1>
  <div id="datetime" class="datetime"></div>

  <div class="sd-info">
    <p>💾 SD: کل <span id="sd-total">--</span>MB | استفاده: <span id="sd-used">--</span>MB | آزاد: <span id="sd-free">--</span>MB</p>
  </div>

  <div class="charts-container">
    <div class="chart-box">
      <h3>اتاق ۱</h3>
      <select class="range-select" data-board="esp32_1">
        <option value="hourly">ساعتی</option>
        <option value="daily" selected>روزانه</option>
        <option value="weekly">هفتگی</option>
        <option value="monthly">ماهانه</option>
      </select>
      <input type="date" class="date-picker" data-board="esp32_1">
      <canvas id="chart1"></canvas>
    </div>
    <div class="chart-box">
      <h3>اتاق ۲</h3>
      <select class="range-select" data-board="esp32_s3">
        <option value="hourly">ساعتی</option>
        <option value="daily" selected>روزانه</option>
        <option value="weekly">هفتگی</option>
        <option value="monthly">ماهانه</option>
      </select>
      <input type="date" class="date-picker" data-board="esp32_s3">
      <canvas id="chart2"></canvas>
    </div>
  </div>

  <div class="door-table">
    <h3>آمار درب امروز</h3>
    <table id="door-table"><thead><tr><th>تگ</th><th>تعداد</th></tr></thead><tbody></tbody></table>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.3.2/papaparse.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
