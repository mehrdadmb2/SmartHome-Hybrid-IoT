<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>داشبورد آنلاین</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg-anim"></div>
  <div class="container glass">
    <header>
      <h1 class="neon-text" data-lang="title">🌐 مانیتورینگ آنلاین</h1>
      <div class="datetime" id="datetime">--</div>
      <div class="controls">
        <button id="theme-toggle">🌓</button>
        <button id="lang-toggle">فا / En</button>
      </div>
    </header>

    <!-- کارت‌های خلاصه (داده‌ها از آخرین رکورد CSV محاسبه می‌شوند) -->
    <div class="status-cards" id="live-cards">
      <div class="card glass"><h3>اتاق ۱</h3><p><span id="t1">--</span>°C | <span id="h1">--</span>%</p></div>
      <div class="card glass"><h3>اتاق ۲</h3><p><span id="t2">--</span>°C | <span id="h2">--</span>%</p></div>
      <div class="card glass"><h3>🚪 درب</h3><p>امروز: <span id="door-total">0</span></p></div>
      <div class="card glass"><h3>💾 SD</h3><p>آزاد: <span id="sd-free">--</span>MB</p></div>
    </div>

    <!-- نمودارها -->
    <div class="charts-grid">
      <div class="chart-card glass">
        <h3>اتاق ۱</h3>
        <select class="range-select" data-board="esp32_1">
          <option value="hourly">ساعتی</option>
          <option value="daily" selected>روزانه</option>
          <option value="weekly">هفتگی</option>
          <option value="monthly">ماهانه</option>
        </select>
        <input type="date" class="date-picker" data-board="esp32_1">
        <canvas id="chart1"></canvas>
      </div>
      <div class="chart-card glass">
        <h3>اتاق ۲</h3>
        <select class="range-select" data-board="esp32_s3">
          <option value="hourly">ساعتی</option>
          <option value="daily" selected>روزانه</option>
          <option value="weekly">هفتگی</option>
          <option value="monthly">ماهانه</option>
        </select>
        <input type="date" class="date-picker" data-board="esp32_s3">
        <canvas id="chart2"></canvas>
      </div>
    </div>

    <footer>SmartHome-Hybrid-IoT</footer>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.3.2/papaparse.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
