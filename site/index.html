<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>خانه هوشمند | داخلی</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>🏠 داشبورد داخلی</h1>
      <div id="datetime">--</div>
    </header>

    <!-- وضعیت نودها -->
    <div class="node-panel glass">
      <h2>وضعیت نودها</h2>
      <div class="node-grid">
        <div class="node" id="node-hub">
          <span class="node-icon">🖥️</span>
          <span class="node-name">هاب ESP32</span>
          <span class="node-status" id="status-hub">●</span>
        </div>
        <div class="node" id="node-s3">
          <span class="node-icon">🌡️</span>
          <span class="node-name">سنسور S3</span>
          <span class="node-status" id="status-s3">●</span>
        </div>
        <div class="node" id="node-door">
          <span class="node-icon">🚪</span>
          <span class="node-name">دربازکن</span>
          <span class="node-status" id="status-door">●</span>
        </div>
      </div>
    </div>

    <!-- کارت‌های خلاصه -->
    <div class="cards">
      <div class="card">
        <h3>اتاق ۱ (ESP32)</h3>
        <p>دما: <span id="t1">--</span>°C | رطوبت: <span id="h1">--</span>%</p>
      </div>
      <div class="card">
        <h3>اتاق ۲ (S3)</h3>
        <p>دما: <span id="t2">--</span>°C | رطوبت: <span id="h2">--</span>%</p>
      </div>
      <div class="card">
        <h3>🚪 درب</h3>
        <p>باز شدن امروز: <span id="door-total">0</span></p>
        <button onclick="openDoor()">باز کردن درب</button>
      </div>
      <div class="card">
        <h3>💾 SD</h3>
        <p>آزاد: <span id="sd-free">--</span>MB / <span id="sd-total">--</span>MB</p>
      </div>
    </div>

    <!-- نمودارها -->
    <div class="charts">
      <div class="chart-box">
        <h3>اتاق ۱</h3>
        <select id="range1" onchange="drawChart('esp32_1','chart1','range1')">
          <option value="hourly">ساعتی</option>
          <option value="daily" selected>روزانه</option>
          <option value="weekly">هفتگی</option>
          <option value="monthly">ماهانه</option>
        </select>
        <canvas id="chart1"></canvas>
      </div>
      <div class="chart-box">
        <h3>اتاق ۲</h3>
        <select id="range2" onchange="drawChart('esp32_s3','chart2','range2')">
          <option value="hourly">ساعتی</option>
          <option value="daily" selected>روزانه</option>
          <option value="weekly">هفتگی</option>
          <option value="monthly">ماهانه</option>
        </select>
        <canvas id="chart2"></canvas>
      </div>
    </div>

    <div class="door-stats">
      <h3>جزئیات باز شدن درب</h3>
      <table id="door-table"><thead><tr><th>تگ</th><th>تعداد</th></tr></thead><tbody></tbody></table>
    </div>
  </div>

  <script src="Chart.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
