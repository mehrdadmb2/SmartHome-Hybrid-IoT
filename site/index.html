<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>داشبورد خانه هوشمند</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="stars"></div>
  <div class="aurora"></div>
  <div class="container glass">
    <header>
      <h1 class="neon-text" data-lang="title">🏠 خانه هوشمند</h1>
      <div class="datetime" id="datetime">--</div>
      <div class="controls">
        <button id="theme-toggle" class="glass-btn">🌓</button>
        <button id="lang-toggle" class="glass-btn">فا / En</button>
      </div>
    </header>

    <div class="node-status-bar glass">
      <div class="node"><span>🖥️ هاب</span><span class="status-dot" id="hub-status"></span></div>
      <div class="node"><span>🌡️ سنسور S3</span><span class="status-dot" id="s3-status"></span></div>
      <div class="node"><span>🚪 دربازکن</span><span class="status-dot" id="door-status"></span></div>
    </div>

    <div class="cards-row">
      <div class="glass card"><div class="card-icon">🌡️</div><h3>اتاق ۱</h3><p>دما: <span id="t1">--</span>°C | رطوبت: <span id="h1">--</span>%</p></div>
      <div class="glass card"><div class="card-icon">🌡️</div><h3>اتاق ۲ (S3)</h3><p>دما: <span id="t2">--</span>°C | رطوبت: <span id="h2">--</span>%</p></div>
      <div class="glass card"><div class="card-icon">🚪</div><h3>درب</h3><p>امروز: <span id="door-total">0</span> بار</p><button id="open-door" class="neon-btn">باز کردن درب</button></div>
      <div class="glass card"><div class="card-icon">💾</div><h3>حافظه SD</h3><p>آزاد: <span id="sd-free">--</span>MB / <span id="sd-total">--</span>MB</p></div>
    </div>

    <div class="charts-grid">
      <div class="glass chart-card">
        <div class="chart-header">
          <h3>نمودار اتاق ۱</h3>
          <select class="range-select" data-board="esp32_1">
            <option value="hourly">ساعتی</option>
            <option value="daily" selected>روزانه</option>
            <option value="weekly">هفتگی</option>
            <option value="monthly">ماهانه</option>
          </select>
        </div>
        <canvas id="chart1"></canvas>
      </div>
      <div class="glass chart-card">
        <div class="chart-header">
          <h3>نمودار اتاق ۲</h3>
          <select class="range-select" data-board="esp32_s3">
            <option value="hourly">ساعتی</option>
            <option value="daily" selected>روزانه</option>
            <option value="weekly">هفتگی</option>
            <option value="monthly">ماهانه</option>
          </select>
        </div>
        <canvas id="chart2"></canvas>
      </div>
    </div>

    <div class="glass table-card">
      <h3>تگ‌های امروز</h3>
      <table id="door-tags-table"><thead><tr><th>تگ</th><th>دفعات</th></tr></thead><tbody></tbody></table>
    </div>

    <div class="glass file-manager">
      <h2>📁 مدیریت فایل‌های SD</h2>
      <div class="file-toolbar">
        <button id="refresh-files" class="glass-btn">🔄 بروزرسانی لیست</button>
        <button id="download-all" class="glass-btn">⬇️ دانلود همه</button>
        <label for="upload-input" class="glass-btn">📤 آپلود فایل</label>
        <input type="file" id="upload-input" multiple style="display:none">
        <input type="text" id="upload-dir" placeholder="/www/" value="/www/" class="glass-input">
      </div>
      <table id="file-table"><thead><tr><th>نام فایل</th><th>حجم (KB)</th><th>عملیات</th></tr></thead><tbody></tbody></table>
    </div>
  </div>

  <script src="Chart.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
