<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>داشبورد هوشمند</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg-anim"></div>
  <div class="container glass">
    <header>
      <h1 class="neon-text" data-lang="title">🏠 خانه هوشمند</h1>
      <div class="datetime" id="datetime">--</div>
      <div class="controls">
        <button id="theme-toggle">🌓</button>
        <button id="lang-toggle">فا / En</button>
      </div>
    </header>

    <!-- کارت‌های وضعیت -->
    <div class="status-cards">
      <div class="card glass">
        <h3 data-lang="room1">اتاق ۱</h3>
        <p>🌡️ <span id="t1">--</span>°C | 💧 <span id="h1">--</span>%</p>
      </div>
      <div class="card glass">
        <h3 data-lang="room2">اتاق ۲ (S3)</h3>
        <p>🌡️ <span id="t2">--</span>°C | 💧 <span id="h2">--</span>%</p>
      </div>
      <div class="card glass">
        <h3 data-lang="door">🚪 درب</h3>
        <p data-lang="doorOpen">باز شدن امروز: <span id="door-total">0</span></p>
        <button id="open-door" data-lang="openDoor">باز کردن درب</button>
      </div>
      <div class="card glass">
        <h3 data-lang="sd">💾 حافظه</h3>
        <p>آزاد: <span id="sd-free">--</span>MB / <span id="sd-total">--</span>MB</p>
      </div>
    </div>

    <!-- پنل نودها -->
    <div class="node-panel glass">
      <h2 data-lang="nodes">وضعیت نودها</h2>
      <div class="nodes">
        <span class="node" id="node-hub">🖥️ هاب <span class="status"></span></span>
        <span class="node" id="node-s3">🌡️ S3 <span class="status"></span></span>
        <span class="node" id="node-door">🚪 درب <span class="status"></span></span>
      </div>
    </div>

    <!-- نمودارها -->
    <div class="charts-grid">
      <div class="chart-card glass">
        <h3 data-lang="chart1">نمودار اتاق ۱</h3>
        <select class="range-select" data-board="esp32_1">
          <option value="hourly">ساعتی</option>
          <option value="daily" selected>روزانه</option>
          <option value="weekly">هفتگی</option>
          <option value="monthly">ماهانه</option>
        </select>
        <canvas id="chart1"></canvas>
      </div>
      <div class="chart-card glass">
        <h3 data-lang="chart2">نمودار اتاق ۲</h3>
        <select class="range-select" data-board="esp32_s3">
          <option value="hourly">ساعتی</option>
          <option value="daily" selected>روزانه</option>
          <option value="weekly">هفتگی</option>
          <option value="monthly">ماهانه</option>
        </select>
        <canvas id="chart2"></canvas>
      </div>
    </div>

    <!-- جدول تگ‌های درب -->
    <div class="door-table glass">
      <h3 data-lang="doorTags">تگ‌های امروز</h3>
      <table>
        <thead><tr><th>تگ</th><th>دفعات</th></tr></thead>
        <tbody id="door-tags"></tbody>
      </table>
    </div>
  </div>

  <script src="Chart.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
